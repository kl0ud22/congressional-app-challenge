
<!doctype html>
<html lang="en">


<head>
  <meta charset="utf-8">
  <!--lets page fit to phone screen-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">

  <title>tr4CKD</title>

  <!--lets phone add app to home screen-->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">

</head>



 
<body>

  <!--app name (tr4CKD) and language select go on top bar-->
  <header>
    <h1>tr4CKD</h1>

    <label class="lang">
      <span aria-hidden="true">🌐</span>
      <!--empty tag because app.js will fill in language options-->
      <select id="language" aria-label="Language"></select>
    </label>

  </header>



  <!--
    note that the app has 3 screens in <main>: start, loading, and result-- but only one is visible at a time
    app.js switches between these screens by toggling the hidden attribute

    the elements that say 'data-text="xxx" ' will use the words from app.js and will be filled in depending on the language selected
    english is the default and fallback here, so it only shows if app.js doesn't load
  -->
  <main>

    <!-------------------------------Camera screens:------------------------------->
    <!--CAMERA SCREEN #1: start screen-->
    <section id="start-screen">
      <!--the big button is the label that can be tapped to open the hidden file input below that opens the phone's camera-->
      <label class="big-button" for="photo">
        <span class="icon" aria-hidden="true">📷</span>
        <span data-text="takePhoto">Take a photo of your food</span>
      </label>

      <!--'capture="environment"' accesses the back camera, input hidden again because label is the button that accesses it-->
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>

    </section>


    <!--CAMERA SCREEN #2: loading screen-->
    <!--(shows while photo is being analyzed)-->
    <section id="loading-screen" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p data-text="checking">Checking your food…</p>
    </section>


    <!--CAMERA SCREEN #3: result screen-->
    <section id="result-screen" hidden aria-live="polite">
      <!--empty boxes will be filled in by app.js with results-->
      <div id="result-card" class="result">
        <div id="result-icon" class="result-icon" aria-hidden="true"></div>
        <p id="result-label" class="result-label"></p>
        <p id="result-food" class="result-food"></p>
        <p id="result-reason" class="result-reason"></p>
        <p id="result-tip" class="result-tip"></p>
        <p id="result-source" class="result-source"></p>
      </div>


      <button id="speak" class="big-button secondary" type="button">
        <span class="icon" aria-hidden="true">🔊</span>
        <span data-text="readAloud">Read out loud</span>
      </button>

      <button id="again" class="big-button" type="button">
        <span class="icon" aria-hidden="true">📷</span>
        <span data-text="tryAnother">Check another food</span>
      </button>

    </section>



    <!-------------------------------Calendar screen:------------------------------->
    <!--CALENDAR SCREEN: shown when calendar tab is opened-->
    <section id="calendar-screen" hidden>
      <h2 data-text="calTitle">Appointments</h2>

      <form id="appointment-form">
        <label>
          <span data-text="calDate">Date</span>
          <input id="appt-date" type="date" required>
        </label>

        <label>
          <span data-text="calTime">Time</span>
          <input id="appt-time" type="time">
        </label>

        <label>
          <span data-text="calNote">What is it for?</span>
          <input id="appt-note" type="text" maxlength="60" required>
        </label>

        <button type="submit" class="big-button">
          <span class="icon" aria-hidden="true">➕</span>
          <span data-text="calAdd">Add appointment</span>
        </button>
      </form>

      <!--Emply so that app.js fills in the saved appointments-->
      <div id="appointment-list"></div>
    </section>



    <!-------------------------------Info screen:------------------------------->
    <!--INFO SCREEN: shown when info tab is opened -->
    <section id="info-screen" hidden>
      <h2 data-text="infoTitle">Kidney info</h2>
      <!--empty div on purpose, app.js fills in the text and links-->
      <div id="info-content"></div>
    </section>


    </section>


  </main>



  <!--Tab bar at bottom of screen, tab switches controlled by app.js-->
  <nav id="tab-bar" aria-label="Main">
    <!--Camera tab-->
    <button type="button" data-tab="camera" class="active" aria-current="page">
      <span class="icon" aria-hidden="true">📷</span>
      <span data-text="tabCamera">Camera</span>
    </button>

    <!--Calendar tab-->
    <button type="button" data-tab="calendar">
      <span class="icon" aria-hidden="true">📅</span>
      <span data-text="tabCalendar">Calendar</span>
    </button>

    <!--Info tab-->
    <button type="button" data-tab="info">
      <span class="icon" aria-hidden="true">ℹ️</span>
      <span data-text="tabInfo">Info</span>
    </button>
  </nav>

  

<!--Constant reminder that this is NOT professional medical advice and to always prioritize the doctor's suggetsions-->
  <footer>
    <p data-text="disclaimer">This is only an estimate, not medical advice. Always follow your doctor and dietitian.</p>
  </footer>

  <script src="app.js" type="module"></script>

</body>


</html>
